name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      # Node 22 satisfies Vite's engine range (^20.19.0 || >=22.12.0).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The Go binary does not embed web/dist, so go build / go test below do
      # not depend on this step; the web build is validated on its own.
      - name: Build web assets
        working-directory: web
        run: npm ci && npm run build
      # Web unit suite (vitest through the host memory-guard wrapper). Runs on
      # a clean clone, so it is a regression gate for the exported snapshot.
      # --retry=2: a known timing flake in PricingPanel.test.tsx (a second
      # empty-state can flash for one render pass between the pricing-rules
      # fetch resolving and its draft-setting effect); retrying keeps CI
      # stable until the test itself is de-flaked.
      - name: Test web assets
        working-directory: web
        run: npm test -- --retry=2
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # TMPDIR is pinned to a short path for the unix-socket tests.
      # Database integration tests self-skip in CI: they require
      # YZAGMGR_TEST_PG_DSN / YZAGMGR_SDK_MYSQL_DSN or PostgreSQL tooling on
      # PATH, none of which is configured here.
      # Browser E2E (web/e2e, Playwright) is intentionally not part of CI;
      # run it locally where its platform requirements hold.
      - name: Test
        run: TMPDIR=/tmp go test ./... -count=1
